name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - feat/liquid-glass
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-deploy:
    name: Check & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Deploy API Worker
        if: github.event_name != 'pull_request'
        run: pnpm --filter @jbb/api deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build Web Worker (OpenNext)
        if: github.event_name != 'pull_request'
        run: pnpm --filter @jbb/web build:worker
        env:
          NEXT_PUBLIC_API_URL: "https://bekasin-api.corporate-e78.workers.dev"
          NEXT_PUBLIC_SITE_URL: "https://belanjanya.id"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: "595496164188-puus9l24v5chr5ucr9uc2plm063vtq68.apps.googleusercontent.com"

      - name: Deploy Web Worker
        if: github.event_name != 'pull_request'
        run: pnpm --filter @jbb/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
